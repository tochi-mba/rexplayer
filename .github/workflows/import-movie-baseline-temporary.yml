# Temporary, branch-scoped utility. It is removed before this pull request is merged.
name: Import Windows CI movie screenshot
on:
  push:
    branches: [fix/0.30.7-main-ui-ci]
    paths: [.github/workflows/import-movie-baseline-temporary.yml]

permissions:
  contents: write
  actions: read

jobs:
  import:
    if: github.event.head_commit.message == 'Temporarily import captured Windows screenshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Copy the actual Windows CI screenshot into the checked baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/tochi-mba/rexplayer/actions/artifacts/12505178087/zip > /tmp/ci-shots.zip
          test -s /tmp/ci-shots.zip
          unzip -p /tmp/ci-shots.zip ci-windows/actual/library-movie-card-letterboxed.png > tests/screenshot-baselines/ci-windows/library-movie-card-letterboxed.png
          test "$(wc -c < tests/screenshot-baselines/ci-windows/library-movie-card-letterboxed.png)" -gt 10000
          file tests/screenshot-baselines/ci-windows/library-movie-card-letterboxed.png | grep -q 'PNG image data, 804 x 265'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/screenshot-baselines/ci-windows/library-movie-card-letterboxed.png
          git commit -m "Refresh movie-card visual baseline using actual CI Windows screenshot"
          git push origin HEAD:fix/0.30.7-main-ui-ci
