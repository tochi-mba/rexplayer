# Temporary branch-only transport for authenticated UI-test artifacts. Remove after the image commit.
name: Import native screenshots for website
on:
  push:
    branches: [ux/website-product-experience]
    paths: [.github/workflows/site-screenshot-import.yml]
permissions:
  contents: write
  actions: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch captured Windows UI from the verified CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39980600142 --repo "$GITHUB_REPOSITORY" --name screenshots --dir /tmp/rexplayer-native
          install -Dm644 /tmp/rexplayer-native/ci-windows/actual/experience-library-wide-dark.png site/assets/windows-library-wide-ci.png
          install -Dm644 /tmp/rexplayer-native/ci-windows/actual/context-menu.png site/assets/windows-welcome-ci.png
          install -Dm644 /tmp/rexplayer-native/ci-windows/actual/experience-search-dark.png site/assets/windows-search-ci.png
          install -Dm644 /tmp/rexplayer-native/ci-windows/actual/preferences-section-subtitles.png site/assets/windows-subtitle-settings-ci.png
          install -Dm644 /tmp/rexplayer-native/ci-windows/actual/library-show-page-collage.png site/assets/windows-tv-episodes-ci.png
          install -Dm644 /tmp/rexplayer-native/ci-windows/actual/preferences-section-playback.png site/assets/windows-playback-settings-ci.png
      - name: Commit preview screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/
          if ! git diff --cached --quiet; then
            git commit -m "Add native Windows UI captures for the site"
            git push origin HEAD:ux/website-product-experience
          fi
