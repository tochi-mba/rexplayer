# The recovery path. Normal releases come from CI when a new version reaches main; this workflow
# republishes a version whose CI release step failed, from the commit that set that version.
name: Release (recovery)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish, exactly as Directory.Build.props says it"
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: The version must be the one in Directory.Build.props
        shell: pwsh
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($version -ne $env:REQUESTED) { throw "This commit builds $version, not $($env:REQUESTED)." }

      - run: ./dev.ps1 build
      - run: ./dev.ps1 test
      - run: ./dev.ps1 gate
      - run: ./dev.ps1 package -Version "${{ inputs.version }}"
      - run: ./dev.ps1 smoke

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Publish, never replacing an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Published releases are immutable; $tag already exists." >&2
            exit 1
          fi
          cd dist
          sha256sum --check *.sha256
          gh release create "$tag" rexplayer-Setup-*.exe rexplayer-Setup-*.exe.sha256 rexplayer-*-win-x64.zip rexplayer-*-win-x64.zip.sha256 \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "rexplayer ${VERSION}" \
            --generate-notes
