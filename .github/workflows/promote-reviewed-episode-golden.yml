# One-time transfer of visually reviewed CI-produced screenshot evidence for PR #525.
# Remove after the exact native golden has been committed.
name: Promote reviewed episode golden
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  promote-reviewed-golden:
    if: ${{ github.event.pull_request.number == 525 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/ci-windows-ui-regressions-525' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Promote hash-verified 1280x800 native episode capture
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40103888169 --repo "$GITHUB_REPOSITORY" --name screenshots --dir "$RUNNER_TEMP/reviewed"
          actual="$RUNNER_TEMP/reviewed/ci-windows/actual/library-episode-still-letterboxed.png"
          printf '%s  %s\n' 'd7e36bb9448b376b8a1510c52533c6f58a01dea7ab80db18c4f5c03eb4a030a0' "$actual" | sha256sum --check --status
          target="tests/screenshot-baselines/ci-windows/library-episode-still-letterboxed.png"
          cp "$actual" "$target"
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(ui): promote reviewed native 1280px episode screenshot'
          git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
