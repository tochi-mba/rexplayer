name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Build, test, gate and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - id: version
        name: Resolve the package version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Directory.Build.props contains an invalid version '$version'." }
          $package = if ($env:EVENT_NAME -eq 'push' -and $env:REF_NAME -eq 'refs/heads/main') { $version } else { "0.0.$env:RUN_NUMBER" }
          "release_version=$version" >> $env:GITHUB_OUTPUT
          "package_version=$package" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $package"

      - name: Check commit text for words this repository never uses
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $messages = if ($env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') { git log --format=%B "$($env:BASE_SHA)..HEAD" } else { git log -1 --format=%B }
          ($env:PR_TITLE, $env:PR_BODY, ($messages -join "`n")) -join "`n" | Set-Content commit-text.txt
          ./dev.ps1 lexicon commit-text.txt

      - name: Build (warnings are errors)
        run: ./dev.ps1 build

      - name: Formatting
        run: dotnet format rexplayer.slnx --verify-no-changes --no-restore

      - name: Tests with coverage
        run: ./dev.ps1 test

      - name: Every required line is covered
        run: ./dev.ps1 gate

      - name: Windows adapter tests
        run: ./dev.ps1 adapters

      - name: Build the installer and the portable zip
        shell: pwsh
        run: ./dev.ps1 package -Version "${{ steps.version.outputs.package_version }}"

      - name: Smoke test the published command line
        run: ./dev.ps1 smoke

      - name: Install, then update the way the app does
        timeout-minutes: 10
        shell: pwsh
        run: ./installer/update-test.ps1 -Installer (Get-Item dist/rexplayer-Setup-*.exe).FullName

      - name: Upload the packages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: ignore
          retention-days: 14

  linux-pure:
    name: Portable engine tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the portable engine and its tests
        run: dotnet build tests/Rex.Media.Tests/Rex.Media.Tests.csproj -c Release -nologo

      - name: Run them
        run: dotnet test --project tests/Rex.Media.Tests/Rex.Media.Tests.csproj -c Release --no-build

  # The same portable suite on a Mac (Apple Silicon), so the engine every macOS build stands on
  # is proved there before any macOS code exists, and stays proved (ADR-0020).
  macos-pure:
    name: Portable engine tests (macOS)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the portable engine and its tests
        run: dotnet build tests/Rex.Media.Tests/Rex.Media.Tests.csproj -c Release -nologo

      - name: Run them
        run: dotnet test --project tests/Rex.Media.Tests/Rex.Media.Tests.csproj -c Release --no-build

      - name: Build the Mac command line
        run: dotnet build src/Rex.Media.Cli.Mac/Rex.Media.Cli.Mac.csproj -c Release -nologo

      - name: Smoke test it against the same contract as Windows'
        shell: pwsh
        run: ./dev.ps1 smoke

  # rexplayer.app for both kinds of Mac, from the one macOS project that needs the platform SDK
  # (ADR-0021). Every release ships it beside Windows' installer (ADR-0020); docs/parity.md says
  # what the Mac window still owes.
  macos-app:
    name: The Mac app, built and bundled (macOS)
    # Every .NET 10 macOS SDK needs Xcode 26.6 or later, which needs macOS 26: so this runs on
    # the macOS 26 image, an Apple Silicon Mac that also builds the Intel app.
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64, universal]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The image's default Xcode, the one it installs whole: a side-by-side copy can lack the
      # macOS SDK (the first macOS 26 run picked such a copy and could not link).
      - name: Read the runner's Xcode
        id: xcode
        run: |
          echo "Using $(xcode-select -p)"
          version=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      # Each macOS SDK release requires one Xcode exactly, so the workload is pinned to the
      # release made for the Xcode this runner has, rather than whatever is newest today
      # (github.com/dotnet/macios/releases lists the pairs).
      - name: Install the macOS workload that matches this Xcode
        env:
          XCODE: ${{ steps.xcode.outputs.version }}
        run: |
          case "$XCODE" in
            27.1*) set=10.0.402.1 ;;
            27.0*) set=10.0.401.1 ;;
            26.6*) set=10.0.401 ;;
            *) echo "No .NET macOS SDK is known to match Xcode $XCODE; add its workload set here." >&2; exit 1 ;;
          esac
          echo "Xcode $XCODE: workload set $set"
          dotnet workload install macos --version "$set"

      - name: Build rexplayer.app
        env:
          RID: ${{ matrix.rid }}
        run: |
          # With no single RID override, the macOS SDK builds both RuntimeIdentifiers and
          # arranges each CPU's managed runtime payload for the generated native launcher.
          args=()
          if [ "$RID" != universal ]; then args=(-r "$RID"); fi
          dotnet publish src/Rex.Media.App.Mac/Rex.Media.App.Mac.csproj -c Release "${args[@]}" -nologo -o "publish/$RID"

      - name: Sign it ad hoc and zip it the way a Mac expects
        run: |
          # Publishing leaves an installer package in the output folder and the bundle itself in bin.
          bundle_root=src/Rex.Media.App.Mac/bin/Release/net10.0-macos
          rid='${{ matrix.rid }}'
          if [ "$rid" != universal ]; then bundle_root="$bundle_root/$rid"; else rid=osx-universal; fi
          app=$(find "$bundle_root" -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "No rexplayer.app was built." >&2; exit 1; }
          echo "Bundling $app"
          codesign --force --deep --sign - --entitlements src/Rex.Media.App.Mac/Entitlements.plist "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/rexplayer-mac-${{ matrix.rid }}.zip"
          python3 scripts/verify-mac-bundle.py \
            --app "$app" \
            --rid "$rid" \
            --minimum 12.0 \
            --zip "dist/rexplayer-mac-${{ matrix.rid }}.zip"
          (cd dist && shasum -a 256 "rexplayer-mac-${{ matrix.rid }}.zip" > "rexplayer-mac-${{ matrix.rid }}.zip.sha256")

      # The real app, launched on the runner's desktop and driven through its automation pipe: it
      # must come up, play a video and quit when asked. The runner is Apple Silicon, so the
      # arm64 build is the one that runs here.
      - name: Start the app and drive it
        if: matrix.rid == 'osx-arm64'
        run: |
          app=$(find src/Rex.Media.App.Mac/bin/Release/net10.0-macos/osx-arm64 -maxdepth 1 -name '*.app' | head -1)
          export REXPLAYER_MAC_APP="$PWD/$app"
          export REXPLAYER_MAC_SCREENSHOTS="$PWD/artifacts/mac-library-screenshots"
          # This controlled runner must match the visually reviewed macOS PNG baselines.
          export REXPLAYER_MAC_SCREENSHOT_BASELINES=1
          dotnet test --project tests/Rex.Media.Tests/Rex.Media.Tests.csproj -c Release -- --filter-class Rex.Media.Tests.AppCore.MacAppSmokeTests

      - name: Keep the native library screenshots
        if: matrix.rid == 'osx-arm64' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-library-screenshots
          path: artifacts/mac-library-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep native Mac queue screenshots
        if: matrix.rid == 'osx-arm64' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-queue-screenshots
          path: artifacts/mac-queue-screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rexplayer-mac-${{ matrix.rid }}
          path: dist/
          retention-days: 14

  macos-universal:
    name: The downloaded universal Mac app (${{ matrix.runner }})
    needs: macos-app
    # Launch the exact downloadable universal bundle on Sequoia, not just the macOS 26 build host.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rexplayer-mac-universal
          path: dist

      - name: Extract and verify the distributed universal app
        run: |
          (cd dist && shasum -a 256 --check rexplayer-mac-universal.zip.sha256)
          ditto -x -k dist/rexplayer-mac-universal.zip .
          codesign --verify --deep --strict rexplayer.app
          python3 scripts/verify-mac-bundle.py \
            --app rexplayer.app \
            --rid osx-universal \
            --minimum 12.0 \
            --zip dist/rexplayer-mac-universal.zip

      # Signing validity alone does not prove the .NET runtime starts on Sequoia.
      # Launch the extracted bundle without modifying it, and exercise playback + a clean quit.
      - name: Launch the release bundle on macOS 15 Sequoia
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d . -f 1)" = "15"
          export REXPLAYER_MAC_APP="$PWD/rexplayer.app"
          dotnet test --project tests/Rex.Media.Tests/Rex.Media.Tests.csproj -c Release -- --filter-class Rex.Media.Tests.AppCore.MacAppSmokeTests

  site:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check the site and its checker
        run: |
          python3 scripts/check_site.py
          python3 -m unittest discover -s tests/site -p "test_*.py"

      - name: Test the page script
        run: node --test tests/site/app.test.mjs

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  perf:
    name: Performance against the committed baselines (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      REXPLAYER_PERF_LANE: ci-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: ./dev.ps1 build

      # Measure fully optimized steady-state code rather than the tier-0 quick JIT,
      # whose promotion timing varies widely on shared Windows runners.
      - name: Measure
        env:
          DOTNET_TieredCompilation: "0"
        run: ./dev.ps1 perf

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-measurements
          path: artifacts/perf/
          if-no-files-found: ignore
          retention-days: 30

  desktop:
    name: The window, driven through UI Automation (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: ./dev.ps1 build

      - name: Drive the window
        env:
          REXPLAYER_UI_LANE: ci-windows
        run: ./dev.ps1 ui

      - name: Repeat offline screenshot fixture suites in fresh processes
        if: success()
        env:
          REXPLAYER_UI_LANE: ci-windows-repeat
        run: |
          dotnet test --project tests/Rex.Media.App.Tests/Rex.Media.App.Tests.csproj -c Release --no-build -- --filter-class Rex.Media.App.Tests.LibraryFixtureVisualTests
          if ($LASTEXITCODE -ne 0) { throw "Repeating library fixture scenes failed." }
          dotnet test --project tests/Rex.Media.App.Tests/Rex.Media.App.Tests.csproj -c Release --no-build -- --filter-class Rex.Media.App.Tests.LibraryEvidenceEdgeTests
          if ($LASTEXITCODE -ne 0) { throw "Repeating long-title fixture scenes failed." }

      - name: Verify image stability across independent app launches
        if: success()
        shell: pwsh
        run: ./scripts/check-screenshot-repeatability.ps1

      # Keep the canonical inventory even if the UI suite aborts before any capture.
      # Per-scene JSON and process logs remain alongside actual, baseline and diff.
      - name: Keep the screenshot scene inventory
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/screenshots/inventory | Out-Null
          Copy-Item tests/screenshot-scenes.json artifacts/screenshots/inventory/screenshot-scenes.json

      # A green UI suite must also prove that all declared scenes emitted
      # both image and machine-readable witnesses on this exact CI head.
      - name: Audit declared screenshot evidence
        if: always()
        shell: pwsh
        run: |
          $inventory = Get-Content tests/screenshot-scenes.json -Raw | ConvertFrom-Json
          $errors = [System.Collections.Generic.List[string]]::new()
          # High-DPI and high-contrast scenes belong to separately configured
          # Windows desktops. Never pretend this regular lane has produced them.
          $required = @($inventory.scenes | Where-Object {
            -not $_.requiredLane -or $_.requiredLane -eq "ci-windows"
          })
          foreach ($scene in $required) {
            $prefix = "artifacts/screenshots/ci-windows/actual/$($scene.id)"
            if (-not (Test-Path "$prefix.png")) {
              $errors.Add("$($scene.id): no rendered PNG")
            }
            if (-not (Test-Path "artifacts/screenshots/ci-windows/window/$($scene.id).png")) {
              $errors.Add("$($scene.id): no full application window evidence")
            }
            if (-not (Test-Path "$prefix.json")) {
              $errors.Add("$($scene.id): no UIA and capture metadata")
              continue
            }
            $evidence = Get-Content "$prefix.json" -Raw | ConvertFrom-Json
            if ($evidence.sceneId -ne $scene.id) {
              $errors.Add("$($scene.id): mismatched sidecar ID")
            }
            if ($scene.captureMode -eq "desktop" -and $evidence.fullyOnDesktop -ne $true) {
              $errors.Add("$($scene.id): desktop screenshot extends off the virtual screen")
            }
            if ($scene.dimensions -match '^\d+x\d+$' -and $evidence.viewportMatchesDeclared -ne $true) {
              $errors.Add("$($scene.id): pinned viewport was not actually rendered at $($scene.dimensions)")
            }
            if ($evidence.readinessAchieved -ne $true) {
              $errors.Add("$($scene.id): UI Automation readiness not proved")
            }
            if ($evidence.pixelReadinessAchieved -ne $true) {
              $errors.Add("$($scene.id): image and pixel witness not proved")
            }
            if ($evidence.repeatabilityAchieved -ne $true -or -not (Test-Path "artifacts/screenshots/ci-windows/repeat/$($scene.id).png")) {
              $errors.Add("$($scene.id): repeated capture is missing or unstable")
            }
          }
          Write-Host "Audited $($required.Count) standard screenshot scenes; dedicated contrast and DPI lanes remain separate acceptance gates."
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "SCREENSHOT EVIDENCE GAP: $_" }
            throw "$($errors.Count) screenshot evidence gap(s); see the retained screenshots artifact."
          }

      - name: Build browseable screenshot review gallery
        if: always()
        run: python scripts/build-screenshot-review.py

      # Every screenshot as CI drew it, and a diff for any that failed: the only source of the
      # baselines in tests/screenshot-baselines/ci-windows (see tests/Rex.Media.App.Tests/Screenshots.cs).
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish a new version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, linux-pure, macos-pure, macos-app, macos-universal, site, perf, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The release notes are the changelog's section for the version: rexplayer's own update panel
      # shows them, so they are written for people, not generated from merged changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist

      # Both Macs' apps: one version ships for every platform, or for none (ADR-0020).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rexplayer-mac-*
          merge-multiple: true
          path: dist

      - name: Verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows.outputs.release_version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists; published releases are immutable."
            exit 0
          fi
          # The changelog's section for this version, without its heading; generated notes only if it has none.
          awk -v heading="## ${RELEASE_VERSION} " 'index($0, heading) == 1 || $0 == substr(heading, 1, length(heading) - 1) { found = 1; next }
            found && /^## / { exit }
            found { print }' CHANGELOG.md > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then notes=(--notes-file "$PWD/release-notes.md"); else notes=(--generate-notes); fi
          cd dist
          sha256sum --check rexplayer-Setup-*.exe.sha256
          sha256sum --check rexplayer-*-win-x64.zip.sha256
          sha256sum --check rexplayer-mac-osx-arm64.zip.sha256 rexplayer-mac-osx-x64.zip.sha256 rexplayer-mac-universal.zip.sha256
          # The same installer under a name that never changes, so .../releases/latest/download/rexplayer-Setup.exe
          # (the site's download button) is always the newest.
          cp "rexplayer-Setup-${RELEASE_VERSION}.exe" rexplayer-Setup.exe
          gh release create "$tag" rexplayer-Setup-*.exe rexplayer-Setup-*.exe.sha256 rexplayer-Setup.exe rexplayer-*-win-x64.zip rexplayer-*-win-x64.zip.sha256 \
            rexplayer-mac-osx-arm64.zip rexplayer-mac-osx-arm64.zip.sha256 rexplayer-mac-osx-x64.zip rexplayer-mac-osx-x64.zip.sha256 \
            rexplayer-mac-universal.zip rexplayer-mac-universal.zip.sha256 \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "rexplayer ${RELEASE_VERSION}" \
            "${notes[@]}" \
            --latest
